function homepage(){return `<div class="head"><div class="identity"><div class="logo">▤</div><div class="brand">Smart Library <span style="color:#1370b1">UNISA</span><small>Il tuo posto studio, in pochi tocchi</small></div></div><span class="demo">PROTOTIPO</span></div><div class="intro"><h1>Trova il tuo posto.</h1><p>Esplora le biblioteche e le aree studio del campus.</p></div>${totalBadge()}${elapsed()}<section class="section"><div class="sectiontitle">Scegli la sede <span>tocca la mappa</span></div>${mapGraphic()}<p class="mapHint">Cartina illustrativa del campus: ubicazioni schematiche, non geografiche.</p><div class="sectiontitle">Elenco sedi <span>6 sedi</span></div><div class="chips"><button class="chip ${filter==='tutti'?'active':''}" data-do="filter" data-id="tutti">Tutte</button><button class="chip ${filter==='biblioteche'?'active':''}" data-do="filter" data-id="biblioteche">Biblioteche</button><button class="chip ${filter==='aule'?'active':''}" data-do="filter" data-id="aule">Aule studio</button></div><div class="venueList">${venueList()}</div></section><div class="infoFoot">Prototipo illustrativo non ufficiale. Tutti i dati di disponibilità sono simulati; nessun collegamento ai sistemi UNISA.</div>`}
const labels={libero:'Libero',prenotato:'Prenotato',occupato:'Occupato',assente:'Assente'},stateIcon={libero:'▢',prenotato:'◷',occupato:'▣',assente:'↗'};
function bookingCard(){if(!booking)return '';const loc=locations.find(l=>l.id===booking.loc),s=seats[booking.loc][booking.i];if(!s||!s.mine)return '';let msg='',actions='';if(s.state==='prenotato'){msg=`Check-in entro ${s.until-minute} minuti.`;actions=`<button class="primary" data-do="checkin">✓ Fai check-in</button><button class="secondary" data-do="cancel">Annulla</button>`}else if(s.state==='occupato'){msg='Postazione occupata e confermata.';actions=`<button class="primary" data-do="leave">Mi allontano</button><button class="secondary" data-do="cancel">Libera</button>`}else if(s.state==='assente'){msg=`Rientra entro ${s.until-minute} minuti.`;actions=`<button class="primary" data-do="return">Sono tornato</button><button class="secondary" data-do="cancel">Libera</button>`}return `<div class="session"><span class="myBadge">La tua postazione</span><h3 style="margin-top:8px">${loc.short} · ${loc.code}-${String(booking.i+1).padStart(2,'0')}</h3><p>${labels[s.state]} · ${msg}</p><div class="actions">${actions}</div></div>`}
function venuePage(){const l=locations.find(x=>x.id===current),s=seats[current][chosen];return `<div class="head"><button class="back" data-do="nav" data-id="mappa">‹ Mappa</button><span class="demo">PROTOTIPO</span></div><div class="pageTitle"><h2>${l.short}</h2><p>${l.note} · ${l.type==='b'?'Biblioteca':'Area studio'} · 10 posti simulati</p></div>${elapsed()}<div class="summary">${['libero','prenotato','occupato','assente'].map(x=>`<div class="summaryItem ${x}"><strong>${count(current,x)}</strong><span>${labels[x]}</span></div>`).join('')}</div><div class="section"><div class="sectiontitle">Seleziona una postazione <span>tocca un posto</span></div><div class="legend">${['libero','prenotato','occupato','assente'].map(x=>`<span><i class="dot ${x==='libero'?'':x}"></i>${labels[x]}</span>`).join('')}</div><div class="seatGrid">${seats[current].map((x,i)=>`<button class="seat ${x.state==='libero'?'':x.state} ${chosen===i?'sel':''}" data-do="seat" data-n="${i}" aria-label="Postazione ${i+1} ${labels[x.state]}"><span>${stateIcon[x.state]}</span><b>${String(i+1).padStart(2,'0')}</b><small>${labels[x.state]}</small></button>`).join('')}</div><div class="selectedPanel"><h3>Postazione ${l.code}-${String(chosen+1).padStart(2,'0')}</h3><p>Stato: <strong>${labels[s.state]}</strong>${s.mine?' · La tua prenotazione':''}</p>${s.mine?bookingCard():`<button class="primary" style="width:100%" data-do="book" ${s.state!=='libero'||booking?'disabled':''}>${s.state==='libero'?(booking?'Hai già un posto assegnato':'Prenota questo posto'):'Postazione non disponibile'}</button>`}</div><p class="infoFoot" style="padding:12px 0">Prenotazioni: check-in entro 15 minuti. Assenza: massimo 10 minuti prima del rilascio.</p></div>`}
function myPage(){return `<div class="head"><div class="identity"><div class="logo">▤</div><div class="brand">Prenotazioni<small>Gestisci il tuo posto studio</small></div></div></div><div class="section" style="padding-top:20px">${booking?bookingCard():`<div class="empty"><div class="emptyIcon">▤</div><b>Nessuna prenotazione attiva</b><p>Seleziona una biblioteca o un'aula studio per prenotare un posto libero.</p><button class="primary" data-do="nav" data-id="mappa">Scegli una sede</button></div>`}</div>${elapsed()}`}
function guidePage(){return `<div class="head"><div class="identity"><div class="logo">▤</div><div class="brand">Come funziona<small>Smart Library · prototipo</small></div></div></div><div class="guide"><h2 style="font-size:22px">Dal posto libero al check-in</h2>${[['1 · Scegli la sede','Tocca una biblioteca o un’aula studio sulla mappa.'],['2 · Seleziona il posto','Verde significa libero; gli altri stati non sono prenotabili.'],['3 · Prenota','Hai 15 minuti di tempo simulato per fare check-in.'],['4 · Gestisci l’assenza','Se ti allontani, hai 10 minuti per tornare.'],['5 · Prova i timer','I pulsanti +1 e +5 minuti avanzano il tempo simulato.']].map(x=>`<div class="guidecard"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}<button class="primary" style="width:100%" data-do="nav" data-id="mappa">Vai alla mappa</button><p class="infoFoot" style="padding:14px 0">Le biblioteche A3 e G e l’aula studio D1 sono sedi reali; le altre aree sono illustrative. Dati e mappa non sono in tempo reale.</p></div>`}
function render(){view.innerHTML=tab==='mappa'?homepage():tab==='sede'?venuePage():tab==='prenotazioni'?myPage():guidePage();nav.innerHTML=[['mappa','⌖','Mappa'],['prenotazioni','▦','Prenotazioni'],['guida','ⓘ','Guida']].map(x=>`<button class="navItem ${tab===x[0]||(tab==='sede'&&x[0]==='mappa')?'active':''}" data-do="nav" data-id="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function expire(){if(!booking)return;const x=seats[booking.loc][booking.i];if(x.until!=null&&minute>=x.until&&(x.state==='prenotato'||x.state==='assente')){x.state='libero';x.mine=false;x.until=null;booking=null;message('Tempo scaduto: la postazione è tornata libera.')}}
function change(action){if(!booking)return;const s=seats[booking.loc][booking.i];if(action==='checkin'&&s.state==='prenotato'){s.state='occupato';s.until=null;message('Check-in confermato: posto occupato.')}else if(action==='leave'&&s.state==='occupato'){s.state='assente';s.until=minute+10;message('Assenza avviata: 10 minuti per tornare.')}else if(action==='return'&&s.state==='assente'){s.state='occupato';s.until=null;message('Bentornato! Il posto è di nuovo occupato.')}else if(action==='cancel'){s.state='libero';s.mine=false;s.until=null;booking=null;message('Postazione liberata.')}render()}
function doBook(){const s=seats[current][chosen];if(booking){message('Hai già una postazione assegnata.');return}if(s.state!=='libero'){message('Questo posto non è disponibile.');return}s.state='prenotato';s.mine=true;s.until=minute+15;booking={loc:current,i:chosen};render();message('Prenotazione effettuata! Check-in entro 15 minuti.')}
function navigate(t){tab=t;render();view.scrollTop=0}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const a=b.dataset.do;if(a==='nav')navigate(b.dataset.id);else if(a==='open'){current=b.dataset.id;chosen=0;navigate('sede')}else if(a==='filter'){filter=b.dataset.id;render()}else if(a==='seat'){chosen=+b.dataset.n;render()}else if(a==='time'){minute+=+b.dataset.n;expire();render()}else if(a==='reset')reset(true);else if(a==='book')doBook();else if(['checkin','leave','return','cancel'].includes(a))change(a)});
reset(false);
})();
</script>
<div class="touchCursor" id="touchCursor" aria-hidden="true"></div>
<script>
(function(){
const tc=document.getElementById('touchCursor'), phone=document.querySelector('.iphone');
let off;
function show(x,y){tc.style.left=x+'px';tc.style.top=y+'px';tc.classList.add('visible');}
// Su PC compare il cerchietto invece della freccia, ma su smartphone il tocco resta nativo.
window.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse' && phone.contains(e.target))show(e.clientX,e.clientY);
  else if(e.pointerType==='mouse')tc.classList.remove('visible');
},{passive:true});
window.addEventListener('pointerdown',e=>{
  if(phone.contains(e.target)){
    show(e.clientX,e.clientY);tc.classList.add('tap');clearTimeout(off);
    off=setTimeout(()=>tc.classList.remove('tap'),260);
    if(e.pointerType!=='mouse')setTimeout(()=>tc.classList.remove('visible'),420);
  }
},{passive:true});
window.addEventListener('mouseout',e=>{if(!e.relatedTarget)tc.classList.remove('visible')});
})();
</script>
</body></html>
